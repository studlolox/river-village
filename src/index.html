<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#2d5a3c" />
  <title>River Village</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game-canvas" aria-label="River Village World"></canvas>

    <!-- Top HUD -->
    <header id="hud-top" class="hud-panel">
      <div class="hud-row">
        <span id="hud-holding" class="hud-title">Honeysuckle Holding</span>
        <span id="hud-date">Spring 1, Yr 1</span>
        <span id="hud-time">6:00 AM</span>
      </div>
      <div class="hud-row hud-stats">
        <span id="hud-gold">500g</span>
        <span id="hud-energy">Energy: 100/100</span>
        <span id="hud-location">Bedroom</span>
      </div>
    </header>

    <!-- Top-right quick actions (all >= 44x44 CSS px) -->
    <div id="hud-actions">
      <button id="btn-sleep" class="touch-btn" type="button" aria-label="Sleep">Sleep</button>
      <button id="btn-save" class="touch-btn" type="button" aria-label="Save">Save</button>
      <button id="btn-load" class="touch-btn" type="button" aria-label="Load">Load</button>
      <button id="btn-settings" class="touch-btn" type="button" aria-label="Settings">Settings</button>
      <button id="btn-install" class="touch-btn hidden" type="button" aria-label="Install App">Install</button>
    </div>

    <!-- Mobile Touch D-Pad -->
    <nav id="touch-dpad" aria-label="Movement Controls">
      <button class="touch-btn dpad-btn" data-dir="up" type="button" aria-label="Move Up">▲</button>
      <div class="dpad-mid">
        <button class="touch-btn dpad-btn" data-dir="left" type="button" aria-label="Move Left">◀</button>
        <button class="touch-btn dpad-btn" data-dir="down" type="button" aria-label="Move Down">▼</button>
        <button class="touch-btn dpad-btn" data-dir="right" type="button" aria-label="Move Right">▶</button>
      </div>
    </nav>

    <!-- Action Button -->
    <div id="touch-action-pad">
      <button id="btn-interact" class="touch-btn action-btn" type="button" aria-label="Use Tool or Interact">Act</button>
    </div>

    <!-- Character Creation Modal -->
    <section id="modal-char-create" class="modal" role="dialog" aria-modal="true" aria-labelledby="cc-title">
      <div class="modal-card">
        <h1 id="cc-title">Welcome to River Village</h1>
        <p class="subtitle">Name yourself and your holding to begin.</p>
        <label class="field">
          <span>Your Name</span>
          <input id="input-player-name" type="text" value="Aria" maxlength="24" />
        </label>
        <label class="field">
          <span>Holding Name</span>
          <input id="input-holding-name" type="text" value="Honeysuckle Holding" maxlength="32" />
        </label>
        <label class="field">
          <span>Outfit Color</span>
          <input id="input-outfit-color" type="color" value="#3c7a57" />
        </label>
        <button id="btn-start-game" class="touch-btn primary-btn" type="button">Begin New Life</button>
      </div>
    </section>

    <!-- Settings Modal -->
    <section id="modal-settings" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-card">
        <h2 id="settings-title">Settings</h2>
        <div class="setting-row">
          <span>Music</span>
          <button id="btn-toggle-music" class="touch-btn" type="button">On</button>
        </div>
        <div class="setting-row">
          <span>Sound Effects</span>
          <button id="btn-toggle-sfx" class="touch-btn" type="button">On</button>
        </div>
        <div class="setting-row">
          <span>Save Slot 1</span>
          <button id="btn-delete-save" class="touch-btn danger-btn" type="button">Delete Save</button>
        </div>
        <button id="btn-close-settings" class="touch-btn primary-btn" type="button">Close</button>
      </div>
    </section>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
